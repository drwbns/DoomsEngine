#======================================================================
 
# Graphics
[Graphics]

# SELECT GRAPHICS API OPENGL OR DX11

# OPENGL
# D3D11
GRAPHICS_API = D3D11

SCREEN_WIDTH = 1280
SCREEN_HEIGHT = 720
MULTI_SAMPLE = 0

# PBR OR DEFERRED_RENDERING
TARGET_GRAPHICS_PIPELINE = DEFERRED_RENDERING

CULL_DISTANCE1_VOLUME_RADIUS = 1
CULL_DISTANCE1_VOLUME_DISTANCE = 250
CULL_DISTANCE2_VOLUME_RADIUS = 10
CULL_DISTANCE2_VOLUME_DISTANCE = 500 
CULL_DISTANCE3_VOLUME_RADIUS = 10000
CULL_DISTANCE3_VOLUME_DISTANCE = 0 // 0 mean max

OVERDRAW_VISUALIZATION = FALSE

# Which occlusion technique the engine boots with.
#
#   0 = none, 1 = frustum only,
#   2 = frustum + software occlusion, 3 = frustum + Hi-Z
#
# 3 because it is the fastest of the four when measured rather than assumed:
# 2.8 ms a frame against 3.0 for software occlusion, Release, spawn view,
# both rendering the same image. The margin is about seven percent, not the
# "fifth of the cpu" an earlier Debug measurement claimed.
#
# This used to be imposed in code over whatever the file said, which made the
# MASKED_OC settings below look inert. It is read from here now, so the file
# means what it says. DOOMS_OCCLUSION_MODE overrides it for scripted runs.
OCCLUSION_MODE = 3

# Runs the Hi-Z staleness margin sweep as soon as the scene is up, writes
# hiz_margin_sweep.csv beside the executable and puts the margin back. Off
# here because it turns the visibility oracle on, which is expensive; the T
# key starts the same sweep by hand.
HIZ_MARGIN_SWEEP_ON_START = FALSE
MASKED_OC_OCCLUDER_BOUNDING_BOX_SCALE_USED_FOR_SELECTING_OCCLUDER = 0.8
MASKED_OC_OCCLUDER_VIEW_SPACE_BOUNDING_SPHERE_RADIUS = 0.5
MASKED_OC_OCCLUDER_AABB_SCREEN_SPACE_MIN_AREA = 300000.0
MASKED_OC_OCCLUDER_LIMIT_OF_DISTANCE_TO_CAMERA = 80.0
DRAW_MASKED_OCCLUSION_CULLING_BIN_TRIANGLE_STAGE_DEBUGGER = FALSE
DRAW_MASKED_OCCLUSION_CULLING_TILE_COVERAGE_MASK_DEBUGGER = FALSE
DRAW_MASKED_OCCLUSION_CULLING_TILE_L0_MAX_DEPTH_VALUE_DEBUGGER = FALSE

WINDOW_TITLE = SUNG_JIN_KANG(hour30000@gmail.com)

#======================================================================

[SYSTEM]
MAX_SUB_THREAD_COUNT = 4
ITERATION_PER_SECOND = 60
TARGET_FRAME_RATE = 0
FRAME_DELAY_MILLISECOND = 0
MIN_DEBUG_LEVEL = 14
MAX_DEBUG_LEVEL = 16
DISABLE_PROFILER = TRUE
AUTO_THREAD_AFFINITY = FALSE
AUTO_THREAD_PRIORITY = TRUE
PRINT_GENERATE_REFLECTION_DATA_VERBOSE = FALSE
CL_SCAN_RELATIVE_PATH = clscan.dll
CL_MERGE_RELATIVE_PATH = clmerge.dll
CL_EXPORT_RELATIVE_PATH = clexport.dll
SOURCE_DEPENDENCIES_FOLDER_NAME = SourceDependencies
ENABLED_REFLECTION = TRUE
GENERATE_REFLECTION_DATA = FALSE
REFLECTION_BINARY_FILE_NAME = reflection_binary
GC_MULTITHREAD_ENABLED = TRUE
GC_TIME_STEP = 90.0
GC_MAX_SWEEPED_OBJECT_COUNT_AT_A_TIME = 45

[PHYSICS]
ENABLE = 0
FIXED_TIME_STEP = 0.1
MAX_PHYSICS_STEP = 1
ENLARGED_AABB3D_OFFSET = 2.0;
ENLARGED_AABB2D_OFFSET = 0.1;

[USERINPUT]
CURSOR_IS_VISIBLE = TRUE
CURSOR_LOCKED_IN_SCREEN = FALSE

[TEXTURE]
COMPRESSION_QUALITY = 0.6
MIP_MAP_LEVELS = 3
MAX_IMAGE_SIZE = 2048

[SHORTCUT]
PRINT_THREAD_USAGE = KEY_1
